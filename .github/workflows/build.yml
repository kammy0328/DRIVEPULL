name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q -s tests

      - name: Embed OAuth client (GitHub Secrets)
        shell: python
        env:
          CID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CSEC: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          import os
          cid, sec = os.environ.get("CID", ""), os.environ.get("CSEC", "")
          with open("drivepull/_client_config.py", "w", encoding="utf-8") as f:
              f.write(f"CLIENT_ID = {cid!r}\nCLIENT_SECRET = {sec!r}\n")
          print("OAuth client embedded" if cid else "No OAuth secret: users load client_secret.json in settings")

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DRIVEPULL
          --icon assets/icon.ico --add-data "assets;assets"
          --hidden-import drivepull._client_config
          run.py

      - uses: actions/upload-artifact@v4
        with:
          name: DRIVEPULL-windows
          path: dist/DRIVEPULL.exe

      # main 에 올라온 버전(config.py APP_VERSION)의 Release 가 없으면 자동 생성
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('drivepull/config.py', encoding='utf-8').read()).group(1))")
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "v$ver 이미 있음: exe 교체"
            gh release upload "v$ver" dist/DRIVEPULL.exe --clobber
          else
            gh release create "v$ver" dist/DRIVEPULL.exe --title "DRIVEPULL $ver" --generate-notes --latest
          fi
